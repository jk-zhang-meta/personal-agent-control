min_version = "2026.8.2"

[settings]
lockfile = true
locked = true
locked_verify_provenance = true
lockfile_platforms = ["linux-x64", "macos-arm64"]

[settings.npm]
package_manager = "aube"

[tools]
node = "24.18.0"
apm = "0.28.0"
"npm:rulesync" = "16.7.0"
"npm:skills" = "1.5.22"
"npm:@colbymchenry/codegraph" = "1.5.0"
"aqua:astral-sh/uv" = "0.12.1"
"pipx:skills-ref" = "0.1.1"
"aqua:gitleaks/gitleaks" = "8.30.1"
"aqua:koalaman/shellcheck" = "0.11.0"
"aqua:BurntSushi/ripgrep" = "15.2.0"

[tasks.render]
description = "Compile canonical Rulesync inputs into committed host adapters"
run = "./scripts/render.sh --write"

[tasks.check]
description = "Run static, integrity, compiler-drift, shell, and secret checks"
run = "./scripts/check.sh"

[tasks.test-install]
description = "Apply and verify the complete system in a disposable home"
run = "./tests/install-isolated.sh"
